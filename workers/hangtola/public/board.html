<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!--
/**
 * [INPUT]: 依赖 #hangtola-data 内嵌 JSON（由 render-board.js 注入），依赖浏览器原生 Pointer Events / Canvas / FileReader / IndexedDB
 * [OUTPUT]: 对外提供 夯到拉排行榜 独立编辑器：榜单本体为经典黑框浅色表格（原汁原味，导出即所见），
 *           外壳遵循 Apple 设计系统（#f5f5f7 画布 / #0066cc 主色 / 毛玻璃胶囊 touch bar / 18px 圆角面板），
 *           指针拖拽排序定档（鼠标+触屏统一）、轻点卡片改名、批量图片上传/拖入/粘贴、JSON 导入导出、
 *           干净无水印透明 PNG 导出（3:4 / 4:3 / 16:9 画幅即比例：卡片槽位参与铺满，档位文字随行高保持光学比例）、
 *           软键盘上浮面板（visualViewport → --kb）、费曼文案表单、声明条默认文案填入后确认保存、重置重放不刷新
 * [POS]: hangtola 技能的唯一模板资产，由 scripts/render-board.js 校验并注入数据后交付给用户独立运行
 * [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
 */
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夯到拉榜单</title>
<meta name="description" content="夯到拉排行榜：批量上传图片或添加纯文字，写名称、拖拽定档，导出干净透明 PNG。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23fb2018'/><text x='50' y='74' font-size='64' font-weight='700' text-anchor='middle' fill='%23fff' font-family='PingFang SC,Microsoft YaHei,sans-serif'>夯</text></svg>">
<style>
/* ============================================================
   基础：浅色经典主题（对齐参考图）
   ============================================================ */
:root {
  /* 外壳：Apple 设计系统 浅色（画布 #f5f5f7 · 墨 #1d1d1f · 主色 #0066cc） */
  --page: #f5f5f7;
  --ink: #1d1d1f;
  --dim: #86868b;
  --accent: #0066cc;
  --accent-focus: #0071e3;
  --glass: rgba(255, 255, 255, 0.72);
  --panel-bg: rgba(255, 255, 255, 0.92);
  --panel-btn: #f5f5f7;
  --panel-btn-h: #ebebef;
  --input-bg: #fff;
  --input-bd: #d2d2d7;
  --pool-bg: #fff;
  --pool-bd: #d2d2d7;
  --mask: rgba(0, 0, 0, 0.12);
  /* 榜单本体（经典 tier list，随模式换肤） */
  --row: #d2d4d8;
  --grid-ink: #111213;
  --chip-bg: #1d1d1f;       /* 文字卡：反色墨块，高对比 */
  --chip-ink: #fff;
  --thumb-ring: rgba(17, 18, 19, 0.28);
  --border-w: 2.5px;
  /* 安全区：容器可注入 --safe-area-inset-*，浏览器回落 env()；--kb 由软键盘监听实时写入 */
  --safe-b: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
}
:root[data-theme="dark"] {
  /* 外壳：Apple 深色（iOS 深空灰 · 主色 #0a84ff） */
  --page: #161617;
  --ink: #f5f5f7;
  --dim: #86868b;
  --accent: #0a84ff;
  --accent-focus: #409cff;
  --glass: rgba(28, 28, 30, 0.72);
  --panel-bg: rgba(28, 28, 30, 0.92);
  --panel-btn: #2c2c2e;
  --panel-btn-h: #3a3a3c;
  --input-bg: #1c1c1e;
  --input-bd: #3a3a3c;
  --pool-bg: #1c1c1e;
  --pool-bd: #3a3a3c;
  --mask: rgba(0, 0, 0, 0.4);
  --row: #3a3a3e;
  --grid-ink: #0b0b0c;
  --chip-bg: #f5f5f7;
  --chip-ink: #111213;
  --thumb-ring: rgba(0, 0, 0, 0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--page); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
body { max-width: 1100px; margin: 0 auto; padding: 28px 20px 140px; -webkit-tap-highlight-color: transparent; }

/* ============================================================
   标题
   ============================================================ */
#board-title {
  text-align: center; font-size: clamp(22px, 4.5vw, 34px); font-weight: 700;
  letter-spacing: -0.374px; outline: none; margin-bottom: 20px; min-height: 1em;
}
#board-title:empty::before { content: "点击添加标题"; color: var(--dim); font-weight: 500; font-size: 0.6em; }

/* ============================================================
   榜单表格：黑细边框连体网格
   ============================================================ */
#board { border: var(--border-w) solid var(--grid-ink); background: var(--row); }
.tier { display: flex; border-bottom: var(--border-w) solid var(--grid-ink); }
.tier:last-child { border-bottom: none; }
.tier-label {
  flex: 0 0 clamp(76px, 14vw, 150px);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(17px, 2.8vw, 27px); font-weight: 800; color: #111213;
  text-align: center; line-height: 1.25; padding: 10px 6px;
  border-right: var(--border-w) solid var(--grid-ink);
  outline: none; word-break: break-all;
}
.tier-items {
  flex: 1; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px;
  min-height: clamp(100px, 19vw, 130px); align-content: flex-start;
}
.tier-items.drag-over { background: rgba(255, 255, 255, 0.45); }
/* 底部声明条：与网格外框咬合的黑底白字，是表格的最后一行；清空则不存在 */
#board-footnote {
  background: var(--grid-ink); color: #fff; outline: none;
  padding: 9px 16px; text-align: center; line-height: 1.4;
  font-size: clamp(11px, 1.7vw, 13px); font-weight: 500; letter-spacing: 0.2px;
}
#board-footnote:empty { display: none; }

/* ============================================================
   备选区
   ============================================================ */
#pool-section { margin-top: 26px; }
#pool-section h2 { font-size: 17px; color: var(--ink); font-weight: 600; letter-spacing: -0.4px; margin-bottom: 10px; }
#pool-wrap { border: 1.5px dashed var(--pool-bd); border-radius: 18px; background: var(--pool-bg); }
#pool-wrap .tier-items { min-height: 84px; }

/* ============================================================
   条目卡片
   ============================================================ */
/* 统一框：所有卡片同一个竖版框（W × W+cap，约 4:5），内容自适应填充 */
body { --card-w: clamp(78px, 16vw, 106px); --cap-h: 20px; }
.card-item {
  position: relative; width: var(--card-w); height: calc(var(--card-w) + var(--cap-h));
  cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: none;
  display: flex; flex-direction: column;
  border-radius: 3px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--thumb-ring);
}
/* 文字卡：色块撑满整框（默认反色墨块，可选 iOS 系统色），字号随字数自适应 */
.card-item.is-txt { background: var(--chip-bg); align-items: center; justify-content: center; }
.card-item .txt {
  padding: 5px; font-weight: 800; text-align: center;
  color: var(--chip-ink); word-break: break-all; line-height: 1.3; max-height: 100%; overflow: hidden;
}
.txt.fs-xl { font-size: clamp(20px, 4vw, 27px); }
.txt.fs-l  { font-size: clamp(16px, 3.2vw, 21px); }
.txt.fs-m  { font-size: clamp(13px, 2.4vw, 16px); }
.txt.fs-s  { font-size: clamp(11px, 2vw, 13px); }
/* 图片卡：无名则图铺满整框；有名则框内上图下名字条（名字条属于框） */
.card-item .thumb { flex: 1; min-height: 0; overflow: hidden; background: #fff; }
.card-item .thumb img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; display: block; }
.card-item .name {
  height: var(--cap-h); line-height: var(--cap-h); font-size: clamp(11px, 2vw, 13px); font-weight: 600;
  background: var(--pool-bg); color: var(--ink); text-align: center; padding: 0 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-item.drag-source { opacity: 0.25; }
#drag-ghost {
  position: fixed; z-index: 300; pointer-events: none;
  transform: translate(-50%, -50%) scale(1.08); opacity: 0.92;
  filter: drop-shadow(0 10px 24px rgba(20, 30, 50, 0.35));
}

/* ============================================================
   底部悬浮 Touch Bar（cardtoday 基因：白玻璃 · 全圆角 · 低对比）
   ============================================================ */
#dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + var(--safe-b));
  z-index: 200; display: flex; align-items: center; gap: 2px;
  padding: 6px; border-radius: 9999px;
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04),
              0 12px 32px rgba(0, 0, 0, 0.12);
}
#dock button {
  border: none; background: transparent; color: var(--ink);
  font-size: 14px; font-weight: 500; font-family: inherit; letter-spacing: -0.224px;
  padding: 11px 16px; border-radius: 9999px; cursor: pointer; white-space: nowrap;
  transition: background 200ms cubic-bezier(0.32, 0.72, 0, 1);
}
#dock button:hover { background: rgba(127, 127, 132, 0.14); }
#dock button:active { background: rgba(127, 127, 132, 0.24); }
#dock button.primary { background: var(--accent); color: #fff; font-weight: 600; }
#dock button.primary:hover { background: var(--accent-focus); }

/* ============================================================
   弹层：面板 + 遮罩（touch bar 的延伸面）
   ============================================================ */
#mask { position: fixed; inset: 0; z-index: 240; background: var(--mask); }
#panel {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: max(calc(84px + var(--safe-b)), calc(var(--kb, 0px) + 12px));
  z-index: 250; width: min(420px, calc(100vw - 32px));
  background: var(--panel-bg);
  backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border-radius: 18px; padding: 17px;
  box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.06),
              0 24px 60px rgba(0, 0, 0, 0.18);
  animation: panel-in 300ms cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes panel-in { from { opacity: 0; transform: translateX(-50%) translateY(12px); } }
#panel h3 { font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: 0.6px; margin-bottom: 12px; text-transform: uppercase; }
#panel h3.panel-title {
  color: var(--ink); font-size: 17px; line-height: 1.35; letter-spacing: -0.32px;
  margin-bottom: 12px; text-transform: none;
}
#panel h3.panel-title:has(+ .panel-subtitle) { margin-bottom: 3px; }
.panel-subtitle { color: var(--dim); font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
#panel .p-row { display: flex; gap: 8px; }
#panel input[type="text"], #panel textarea {
  flex: 1; border: 1px solid var(--input-bd); border-radius: 11px; padding: 11px 14px;
  font-size: 15px; letter-spacing: -0.224px; font-family: inherit; outline: none; background: var(--input-bg); color: var(--ink);
}
#panel input[type="text"]:focus, #panel textarea:focus { border-color: var(--accent-focus); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18); }
#panel textarea { resize: none; height: 84px; line-height: 1.47; }
.panel-control { display: block; width: 100%; }
.panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.panel-actions .p-btn { width: 100%; }
.field-label { display: block; margin: 10px 2px 5px; color: var(--dim); font-size: 12px; font-weight: 600; }
.p-btn {
  border: none; border-radius: 11px; padding: 11px 18px; font-size: 15px; font-weight: 500;
  letter-spacing: -0.224px; font-family: inherit; cursor: pointer; background: var(--panel-btn); color: var(--ink);
  transition: background 200ms cubic-bezier(0.32, 0.72, 0, 1);
}
.p-btn:hover { background: var(--panel-btn-h); }
.p-btn.dark { background: var(--accent); color: #fff; font-weight: 600; }
.p-btn.dark:hover { background: var(--accent-focus); }
.p-btn.tertiary {
  display: block; width: auto; padding: 8px 2px; margin-top: 4px;
  background: transparent; color: var(--accent); font-size: 13px; font-weight: 600;
}
.p-btn.tertiary:hover { background: transparent; color: var(--accent-focus); }
.p-btn.danger { color: #ff3b30; }
.p-btn.wide { display: block; width: 100%; text-align: left; margin-top: 8px; }
.p-btn.wide:first-of-type { margin-top: 0; }
/* 操作单里的底色圆点（仅文字卡）：默认墨块 + iOS 系统色 */
.color-dots { display: flex; gap: 8px; margin-bottom: 12px; }
.color-dots .dot {
  width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
  transition: transform 200ms cubic-bezier(0.32, 0.72, 0, 1);
}
.color-dots .dot:hover { transform: scale(1.12); }
.color-dots .dot.auto { background: var(--chip-bg); }
.color-dots .dot.now { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 操作单里的定档色块：色即是档 */
.tier-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tier-chips .chip {
  flex: 1 1 30%; min-width: 62px; border: none; border-radius: 11px; padding: 11px 4px;
  font-size: 13px; font-weight: 700; font-family: inherit; color: #111213; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14);
  transition: transform 200ms cubic-bezier(0.32, 0.72, 0, 1);
}
.tier-chips .chip:hover { transform: scale(1.04); }
.tier-chips .chip.now { box-shadow: inset 0 0 0 2px var(--accent); }
.tier-chips .pool-chip { background: var(--panel-btn); color: var(--ink); }
.ratio-grid { display: flex; gap: 8px; }
.ratio-grid .p-btn { flex: 1; text-align: center; padding: 14px 0; }
.ratio-grid small { display: block; font-weight: 500; color: var(--dim); margin-top: 3px; font-size: 11px; }
.hidden-input { display: none; }

body.file-over::after {
  content: "松手批量加入图片"; position: fixed; inset: 16px; z-index: 500;
  display: grid; place-items: center; border: 3px dashed var(--accent); border-radius: 24px;
  background: rgba(0, 102, 204, 0.14); color: var(--accent); font-size: 22px; font-weight: 700;
  pointer-events: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}

.hint {
  display: grid; gap: 4px; width: min(100%, 520px); margin: 24px auto 0;
  color: var(--dim); font-size: 13px; letter-spacing: -0.08px; line-height: 1.65; text-align: center;
}
.hint p { margin: 0; }
/* ============================================================
   托管页附加样式：复用编辑器 CSS 变量（Apple 外壳），只加不改
   ============================================================ */
.hero { text-align: center; padding: 48px 0 8px; }
.hero h1 { font-size: clamp(30px, 6vw, 44px); font-weight: 700; letter-spacing: -0.374px; }
.hero p { color: var(--dim); margin-top: 8px; font-size: 15px; }
.gen-card {
  max-width: 560px; margin: 26px auto; padding: 18px;
  background: var(--panel-bg); border-radius: 18px;
  box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.10);
}
.gen-card textarea {
  width: 100%; border: 1px solid var(--input-bd); border-radius: 11px;
  background: var(--input-bg); color: var(--ink);
  padding: 12px 14px; font-size: 15px; font-family: inherit; resize: none; height: 96px; outline: none;
}
.gen-card textarea:focus { border-color: var(--accent-focus); box-shadow: 0 0 0 3px rgba(0,113,227,0.18); }
.gen-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.gen-file { flex: 1; color: var(--dim); font-size: 13px; cursor: pointer; }
.gen-btn {
  border: none; border-radius: 999px; background: var(--accent); color: #fff;
  font-weight: 600; font-size: 15px; font-family: inherit; padding: 12px 22px; cursor: pointer;
}
.gen-btn:disabled { opacity: 0.5; cursor: default; }
.progress-card { max-width: 560px; margin: 0 auto; text-align: center; color: var(--dim); font-size: 14px; }
.progress-bar { height: 6px; border-radius: 999px; background: var(--panel-btn); overflow: hidden; margin: 12px 0; }
.progress-bar > div { height: 100%; background: var(--accent); width: 0; transition: width 300ms ease; }
.board-shell { max-width: 1100px; margin: 0 auto; }
.board-title { text-align: center; font-size: clamp(22px, 4.5vw, 34px); font-weight: 700; letter-spacing: -0.374px; margin: 18px 0; }
.chat-dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + var(--safe-b, 0px)); z-index: 200;
  display: flex; gap: 6px; width: min(560px, calc(100vw - 32px));
  padding: 6px; border-radius: 999px; background: var(--glass);
  backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.12);
}
.chat-dock input {
  flex: 1; border: none; background: transparent; color: var(--ink);
  font-size: 15px; font-family: inherit; padding: 10px 14px; outline: none;
}
.chat-dock button {
  border: none; border-radius: 999px; background: var(--accent); color: #fff;
  font-weight: 600; font-size: 14px; font-family: inherit; padding: 10px 18px; cursor: pointer;
}
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + var(--safe-b, 0px)); z-index: 210;
  display: flex; gap: 10px; align-items: center;
  background: var(--panel-bg); color: var(--ink); font-size: 14px;
  padding: 10px 16px; border-radius: 14px;
  box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.18);
}
.toast button { border: none; background: none; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 14px; }
.board-actions { text-align: center; margin: 16px 0 120px; display: flex; gap: 10px; justify-content: center; }
.board-actions a, .board-actions button {
  border: none; background: var(--panel-btn); color: var(--ink); text-decoration: none;
  font-size: 13px; font-family: inherit; padding: 9px 16px; border-radius: 999px; cursor: pointer;
}
</style>
</head>
<body>
<div class="board-shell">
  <h1 class="board-title" id="hosted-title"></h1>
  <main id="board"></main>
  <p id="board-footnote"></p>
  <section id="pool-section" hidden>
    <h2>备选区</h2>
    <div id="pool-wrap"><div class="tier-items" id="pool-items"></div></div>
  </section>
  <div class="progress-card" id="progress" hidden>
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <span id="progress-stage"></span>
  </div>
  <div class="board-actions">
    <a href="/" id="new-board">再排一个</a>
    <button id="export-html" hidden>下载离线版</button>
    <button id="export-json" hidden>导出数据 JSON</button>
  </div>
</div>
<div class="chat-dock" id="chat-dock" hidden>
  <input id="chat-input" placeholder="对榜单下指令：把 A 移到夯、改标题…">
  <button id="chat-send">改榜</button>
</div>
<div class="toast" id="toast" hidden>
  <span id="toast-text"></span>
  <button id="toast-undo">撤销</button>
</div>

<script type="module">
/**
 * [INPUT]: 依赖公开投影 API、编辑者 ws 协议（auth/doc.full/doc.revision/chat/revert）与编辑器同款 CSS 类
 * [OUTPUT]: 对外提供榜单页：只读实时渲染；持 editRef 者获得聊天改榜、变化摘要 + 一键撤销、离线版/JSON 导出
 * [POS]: apps/web 托管层的榜单体验；渲染复用 .tier/.card-item 视觉，V2 与公开投影统一降维为显示模型
 * [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
 */

const $ = (sel) => document.querySelector(sel);
const boardId = location.pathname.split('/').filter(Boolean).pop();
const editKey = new URLSearchParams(location.hash.replace(/^#/, '')).get('k')
  || localStorage.getItem(`hangtola-edit:${boardId}`);
if (editKey) localStorage.setItem(`hangtola-edit:${boardId}`, editKey);

let latestDoc = null;          // 编辑者：完整 V2；围观者：公开投影
let latestHead = null;

/* ---- 显示模型：V2 条目与公开条目统一成 {text, imageUrl, color} ---- */
function displayImage(image) {
  if (!image) return null;
  if (typeof image === 'string') return image;
  if (image.kind === 'dataurl') return image.dataUrl;
  return `/assets/${boardId}/${image.assetId}`;
}

function fsClass(t) { const n = t.length; return n <= 2 ? 'fs-xl' : n <= 4 ? 'fs-l' : n <= 8 ? 'fs-m' : 'fs-s'; }

function render(doc) {
  $('#hosted-title').textContent = doc.title ?? '';
  const board = $('#board');
  board.innerHTML = '';
  for (const tier of doc.tiers) {
    const row = document.createElement('div');
    row.className = 'tier';
    const label = document.createElement('div');
    label.className = 'tier-label';
    label.style.background = tier.color;
    label.textContent = tier.label;
    const items = document.createElement('div');
    items.className = 'tier-items';
    for (const item of tier.items) items.appendChild(card(item));
    row.append(label, items);
    board.appendChild(row);
  }
  $('#board-footnote').textContent = doc.footnote ?? '';
  const pool = doc.pool ?? [];
  $('#pool-section').hidden = pool.length === 0;
  const poolBox = $('#pool-items');
  poolBox.innerHTML = '';
  for (const item of pool) poolBox.appendChild(card(item));
}

function card(item) {
  const el = document.createElement('div');
  if (item.id) { el.dataset.itemId = item.id; el.dataset.itemText = item.text ?? ''; }
  const imageUrl = displayImage(item.image);
  if (imageUrl) {
    el.className = 'card-item is-img';
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = imageUrl;
    thumb.appendChild(img);
    el.appendChild(thumb);
    if (item.text) {
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.text;
      el.appendChild(name);
    }
  } else {
    el.className = 'card-item is-txt';
    const txt = document.createElement('div');
    txt.className = `txt ${fsClass(item.text ?? '')}`;
    txt.textContent = item.text ?? '';
    if (item.color) {
      el.style.background = item.color;
      const n = parseInt(item.color.slice(1), 16);
      const lum = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
      txt.style.color = lum > 0.62 ? '#111213' : '#fff';
    }
    el.appendChild(txt);
  }
  return el;
}

/* ---- 进度（直链进入生成中的榜单时） ---- */
async function pollPublic() {
  const snapshot = await (await fetch(`/api/boards/${boardId}`)).json();
  if (snapshot.error) { $('#hosted-title').textContent = '榜单不存在'; return null; }
  const gen = snapshot.generation;
  const running = gen.status === 'running';
  $('#progress').hidden = !running;
  if (running) {
    $('#progress-stage').textContent = gen.stage;
    $('#progress-fill').style.width = `${gen.pct}%`;
  }
  if (snapshot.publicDoc && !editKey) render(snapshot.publicDoc);
  return snapshot;
}

/* ---- 编辑者：ws 实时 + 聊天 + 撤销 + 导出 ---- */
let activeSocket = null;

function connectEditor() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const socket = new WebSocket(`${proto}://${location.host}/agents/hangtola-agent/${boardId}`);
  activeSocket = socket;
  let undoTarget = null;

  socket.addEventListener('open', () => socket.send(JSON.stringify({ type: 'auth', editRef: editKey })));
  socket.addEventListener('message', (event) => {
    let frame;
    try { frame = JSON.parse(event.data); } catch { return; }
    switch (frame.type) {
      case 'auth.ok':
        $('#chat-dock').hidden = false;
        $('#export-html').hidden = false;
        $('#export-json').hidden = false;
        break;
      case 'auth.fail':
        localStorage.removeItem(`hangtola-edit:${boardId}`);
        break;
      case 'doc.full':
        latestDoc = frame.doc; latestHead = frame.head;
        render(frame.doc);
        break;
      case 'doc.revision':
        latestDoc = frame.doc; latestHead = frame.revision.id;
        render(frame.doc);
        if (frame.revision.kind === 'patch' && frame.revision.parentId) {
          undoTarget = frame.revision.parentId;
          $('#toast-text').textContent = frame.revision.summary;
          $('#toast').hidden = false;
          clearTimeout(window.__toastTimer);
          window.__toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 8000);
        }
        break;
      case 'chat.done':
        $('#chat-send').disabled = false;
        if (!frame.revisionId) {
          $('#toast-text').textContent = frame.reply;
          $('#toast').hidden = false;
          clearTimeout(window.__toastTimer);
          window.__toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 6000);
        }
        break;
      case 'patch.conflict':
        latestDoc = frame.doc; latestHead = frame.head;
        render(frame.doc);
        $('#toast-text').textContent = '榜单有新版本，已同步最新状态';
        $('#toast').hidden = false;
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 5000);
        break;
      default:
        break;
    }
  });
  socket.addEventListener('close', () => {
    $('#chat-send').disabled = false;               // 防按钮卡死
    setTimeout(connectEditor, 1500);                // 断线重连 + 服务端 doc.full 恢复
  });

  $('#chat-send').addEventListener('click', () => {
    const text = $('#chat-input').value.trim();
    if (!text || socket.readyState !== WebSocket.OPEN) return;
    $('#chat-input').value = '';
    $('#chat-send').disabled = true;
    socket.send(JSON.stringify({ type: 'chat', text }));
  });
  $('#chat-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#chat-send').click(); });
  $('#toast-undo').addEventListener('click', () => {
    if (undoTarget) socket.send(JSON.stringify({ type: 'revert', revisionId: undoTarget }));
    $('#toast').hidden = true;
  });
}

$('#export-json').addEventListener('click', () => {
  if (!latestDoc) return;
  const blob = new Blob([JSON.stringify(latestDoc, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${latestDoc.title || boardId}.json`;
  a.click();
});
$('#export-html').addEventListener('click', async () => {
  const res = await fetch(`/api/boards/${boardId}/export?format=html`, { headers: { 'X-Edit-Ref': editKey } });
  if (!res.ok) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = `${latestDoc?.title || boardId}.html`;
  a.click();
});

/* ============================================================
   编辑者拖拽：手势 → BoardPatchV1（moveItem）
   本地不做乐观更新，渲染交给服务端 doc.revision 回声；
   过期 base → patch.conflict 帧采用服务端版
   ============================================================ */
function enableDrag() {
  const TIER_KEYS = ['hang', 'top', 'upper', 'npc', 'la'];
  let drag = null;

  const zoneOf = (el) => {
    const tierBox = el?.closest('.tier-items');
    if (!tierBox) return null;
    if (tierBox.id === 'pool-items') return { tier: 'pool', box: tierBox };
    const rowIndex = [...document.querySelectorAll('#board .tier .tier-items')].indexOf(tierBox);
    return rowIndex >= 0 ? { tier: TIER_KEYS[rowIndex], box: tierBox } : null;
  };

  document.body.addEventListener('pointerdown', (e) => {
    const cardEl = e.target.closest('.card-item');
    if (!cardEl?.dataset.itemId || e.button > 0) return;
    drag = { el: cardEl, sx: e.clientX, sy: e.clientY, started: false, ghost: null };
  });

  document.body.addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 7) return;
      drag.started = true;
      const ghost = drag.el.cloneNode(true);
      ghost.id = 'drag-ghost';
      const rect = drag.el.getBoundingClientRect();
      ghost.style.width = `${rect.width}px`;
      ghost.style.height = `${rect.height}px`;
      document.body.appendChild(ghost);
      drag.ghost = ghost;
      drag.el.classList.add('drag-source');
    }
    e.preventDefault();
    drag.ghost.style.left = `${e.clientX}px`;
    drag.ghost.style.top = `${e.clientY}px`;
    document.querySelectorAll('.drag-over').forEach((el) => el.classList.remove('drag-over'));
    zoneOf(document.elementFromPoint(e.clientX, e.clientY))?.box.classList.add('drag-over');
  });

  const endDrag = (e, cancelled) => {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (!d.started) return;
    d.ghost?.remove();
    d.el.classList.remove('drag-source');
    document.querySelectorAll('.drag-over').forEach((el) => el.classList.remove('drag-over'));
    if (cancelled || !latestDoc || !latestHead || activeSocket?.readyState !== WebSocket.OPEN) return;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const zone = zoneOf(under);
    if (!zone) return;
    const cards = [...zone.box.querySelectorAll('.card-item')].filter((el) => el !== d.el);
    const targetCard = under.closest('.card-item');
    const index = targetCard && targetCard !== d.el ? Math.max(0, cards.indexOf(targetCard)) : cards.length;
    const tierLabel = zone.tier === 'pool'
      ? '备选区'
      : latestDoc.tiers[TIER_KEYS.indexOf(zone.tier)]?.label ?? zone.tier;
    activeSocket.send(JSON.stringify({
      type: 'patch',
      patch: {
        schemaVersion: 'patch.v1',
        boardId: latestDoc.id,
        baseRevision: latestHead,
        ops: [{ op: 'moveItem', itemId: d.el.dataset.itemId, to: { tier: zone.tier, index } }],
        summary: `把「${d.el.dataset.itemText || '条目'}」移到${tierLabel}`,
        author: { kind: 'web' },
      },
    }));
  };
  document.body.addEventListener('pointerup', (e) => endDrag(e, false));
  document.body.addEventListener('pointercancel', (e) => endDrag(e, true));
}

/* ---- 启动 ---- */
const snapshot = await pollPublic();
if (snapshot) {
  if (snapshot.generation.status === 'running') {
    const timer = setInterval(async () => {
      const s = await pollPublic();
      if (!s || s.generation.status !== 'running') clearInterval(timer);
    }, 800);
  }
  if (editKey) { connectEditor(); enableDrag(); }
  else setInterval(pollPublic, 3000);               // 围观者轻轮询
}
</script>
