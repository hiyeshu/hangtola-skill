<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!--
/**
 * [INPUT]: 依赖 #hangtola-data 内嵌 JSON（由 render-board.js 注入），依赖浏览器原生 Pointer Events / Canvas / FileReader / IndexedDB
 * [OUTPUT]: 对外提供 夯到拉排行榜 独立编辑器：榜单本体为经典黑框浅色表格（原汁原味，导出即所见），
 *           外壳遵循 Apple 设计系统（#f5f5f7 画布 / #0066cc 主色 / 毛玻璃胶囊 touch bar / 18px 圆角面板），
 *           指针拖拽排序定档（鼠标+触屏统一）、轻点卡片改名、批量图片上传/拖入/粘贴、JSON 导入导出、
 *           干净无水印透明 PNG 导出（3:4 / 4:3 / 16:9 画幅即比例：卡片槽位参与铺满，档位文字随行高保持光学比例）、
 *           软键盘上浮面板（visualViewport → --kb）、费曼文案表单、声明条默认文案填入后确认保存、重置重放不刷新
 * [POS]: hangtola 技能的唯一模板资产，由 scripts/render-board.js 校验并注入数据后交付给用户独立运行
 * [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
 */
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夯到拉 Hangtola — 万物皆可排</title>
<meta name="description" content="夯到拉排行榜：批量上传图片或添加纯文字，写名称、拖拽定档，导出干净透明 PNG。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23fb2018'/><text x='50' y='74' font-size='64' font-weight='700' text-anchor='middle' fill='%23fff' font-family='PingFang SC,Microsoft YaHei,sans-serif'>夯</text></svg>">
<style>
/* ============================================================
   基础：浅色经典主题（对齐参考图）
   ============================================================ */
:root {
  /* 外壳：Apple 设计系统 浅色（画布 #f5f5f7 · 墨 #1d1d1f · 主色 #0066cc） */
  --page: #f5f5f7;
  --ink: #1d1d1f;
  --dim: #86868b;
  --accent: #0066cc;
  --accent-focus: #0071e3;
  --glass: rgba(255, 255, 255, 0.72);
  --panel-bg: rgba(255, 255, 255, 0.92);
  --panel-btn: #f5f5f7;
  --panel-btn-h: #ebebef;
  --input-bg: #fff;
  --input-bd: #d2d2d7;
  --pool-bg: #fff;
  --pool-bd: #d2d2d7;
  --mask: rgba(0, 0, 0, 0.12);
  /* 榜单本体（经典 tier list，随模式换肤） */
  --row: #d2d4d8;
  --grid-ink: #111213;
  --chip-bg: #1d1d1f;       /* 文字卡：反色墨块，高对比 */
  --chip-ink: #fff;
  --thumb-ring: rgba(17, 18, 19, 0.28);
  --border-w: 2.5px;
  /* 安全区：容器可注入 --safe-area-inset-*，浏览器回落 env()；--kb 由软键盘监听实时写入 */
  --safe-b: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
}
:root[data-theme="dark"] {
  /* 外壳：Apple 深色（iOS 深空灰 · 主色 #0a84ff） */
  --page: #161617;
  --ink: #f5f5f7;
  --dim: #86868b;
  --accent: #0a84ff;
  --accent-focus: #409cff;
  --glass: rgba(28, 28, 30, 0.72);
  --panel-bg: rgba(28, 28, 30, 0.92);
  --panel-btn: #2c2c2e;
  --panel-btn-h: #3a3a3c;
  --input-bg: #1c1c1e;
  --input-bd: #3a3a3c;
  --pool-bg: #1c1c1e;
  --pool-bd: #3a3a3c;
  --mask: rgba(0, 0, 0, 0.4);
  --row: #3a3a3e;
  --grid-ink: #0b0b0c;
  --chip-bg: #f5f5f7;
  --chip-ink: #111213;
  --thumb-ring: rgba(0, 0, 0, 0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--page); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
body { max-width: 1100px; margin: 0 auto; padding: 28px 20px 140px; -webkit-tap-highlight-color: transparent; }

/* ============================================================
   标题
   ============================================================ */
#board-title {
  text-align: center; font-size: clamp(22px, 4.5vw, 34px); font-weight: 700;
  letter-spacing: -0.374px; outline: none; margin-bottom: 20px; min-height: 1em;
}
#board-title:empty::before { content: "点击添加标题"; color: var(--dim); font-weight: 500; font-size: 0.6em; }

/* ============================================================
   榜单表格：黑细边框连体网格
   ============================================================ */
#board { border: var(--border-w) solid var(--grid-ink); background: var(--row); }
.tier { display: flex; border-bottom: var(--border-w) solid var(--grid-ink); }
.tier:last-child { border-bottom: none; }
.tier-label {
  flex: 0 0 clamp(76px, 14vw, 150px);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(17px, 2.8vw, 27px); font-weight: 800; color: #111213;
  text-align: center; line-height: 1.25; padding: 10px 6px;
  border-right: var(--border-w) solid var(--grid-ink);
  outline: none; word-break: break-all;
}
.tier-items {
  flex: 1; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px;
  min-height: clamp(100px, 19vw, 130px); align-content: flex-start;
}
.tier-items.drag-over { background: rgba(255, 255, 255, 0.45); }
/* 底部声明条：与网格外框咬合的黑底白字，是表格的最后一行；清空则不存在 */
#board-footnote {
  background: var(--grid-ink); color: #fff; outline: none;
  padding: 9px 16px; text-align: center; line-height: 1.4;
  font-size: clamp(11px, 1.7vw, 13px); font-weight: 500; letter-spacing: 0.2px;
}
#board-footnote:empty { display: none; }

/* ============================================================
   备选区
   ============================================================ */
#pool-section { margin-top: 26px; }
#pool-section h2 { font-size: 17px; color: var(--ink); font-weight: 600; letter-spacing: -0.4px; margin-bottom: 10px; }
#pool-wrap { border: 1.5px dashed var(--pool-bd); border-radius: 18px; background: var(--pool-bg); }
#pool-wrap .tier-items { min-height: 84px; }

/* ============================================================
   条目卡片
   ============================================================ */
/* 统一框：所有卡片同一个竖版框（W × W+cap，约 4:5），内容自适应填充 */
body { --card-w: clamp(78px, 16vw, 106px); --cap-h: 20px; }
.card-item {
  position: relative; width: var(--card-w); height: calc(var(--card-w) + var(--cap-h));
  cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: none;
  display: flex; flex-direction: column;
  border-radius: 3px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--thumb-ring);
}
/* 文字卡：色块撑满整框（默认反色墨块，可选 iOS 系统色），字号随字数自适应 */
.card-item.is-txt { background: var(--chip-bg); align-items: center; justify-content: center; }
.card-item .txt {
  padding: 5px; font-weight: 800; text-align: center;
  color: var(--chip-ink); word-break: break-all; line-height: 1.3; max-height: 100%; overflow: hidden;
}
.txt.fs-xl { font-size: clamp(20px, 4vw, 27px); }
.txt.fs-l  { font-size: clamp(16px, 3.2vw, 21px); }
.txt.fs-m  { font-size: clamp(13px, 2.4vw, 16px); }
.txt.fs-s  { font-size: clamp(11px, 2vw, 13px); }
/* 图片卡：无名则图铺满整框；有名则框内上图下名字条（名字条属于框） */
.card-item .thumb { flex: 1; min-height: 0; overflow: hidden; background: #fff; }
.card-item .thumb img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; display: block; }
.card-item .name {
  height: var(--cap-h); line-height: var(--cap-h); font-size: clamp(11px, 2vw, 13px); font-weight: 600;
  background: var(--pool-bg); color: var(--ink); text-align: center; padding: 0 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-item.drag-source { opacity: 0.25; }
#drag-ghost {
  position: fixed; z-index: 300; pointer-events: none;
  transform: translate(-50%, -50%) scale(1.08); opacity: 0.92;
  filter: drop-shadow(0 10px 24px rgba(20, 30, 50, 0.35));
}

/* ============================================================
   底部悬浮 Touch Bar（cardtoday 基因：白玻璃 · 全圆角 · 低对比）
   ============================================================ */
#dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + var(--safe-b));
  z-index: 200; display: flex; align-items: center; gap: 2px;
  padding: 6px; border-radius: 9999px;
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04),
              0 12px 32px rgba(0, 0, 0, 0.12);
}
#dock button {
  border: none; background: transparent; color: var(--ink);
  font-size: 14px; font-weight: 500; font-family: inherit; letter-spacing: -0.224px;
  padding: 11px 16px; border-radius: 9999px; cursor: pointer; white-space: nowrap;
  transition: background 200ms cubic-bezier(0.32, 0.72, 0, 1);
}
#dock button:hover { background: rgba(127, 127, 132, 0.14); }
#dock button:active { background: rgba(127, 127, 132, 0.24); }
#dock button.primary { background: var(--accent); color: #fff; font-weight: 600; }
#dock button.primary:hover { background: var(--accent-focus); }

/* ============================================================
   弹层：面板 + 遮罩（touch bar 的延伸面）
   ============================================================ */
#mask { position: fixed; inset: 0; z-index: 240; background: var(--mask); }
#panel {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: max(calc(84px + var(--safe-b)), calc(var(--kb, 0px) + 12px));
  z-index: 250; width: min(420px, calc(100vw - 32px));
  background: var(--panel-bg);
  backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border-radius: 18px; padding: 17px;
  box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.06),
              0 24px 60px rgba(0, 0, 0, 0.18);
  animation: panel-in 300ms cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes panel-in { from { opacity: 0; transform: translateX(-50%) translateY(12px); } }
#panel h3 { font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: 0.6px; margin-bottom: 12px; text-transform: uppercase; }
#panel h3.panel-title {
  color: var(--ink); font-size: 17px; line-height: 1.35; letter-spacing: -0.32px;
  margin-bottom: 12px; text-transform: none;
}
#panel h3.panel-title:has(+ .panel-subtitle) { margin-bottom: 3px; }
.panel-subtitle { color: var(--dim); font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
#panel .p-row { display: flex; gap: 8px; }
#panel input[type="text"], #panel textarea {
  flex: 1; border: 1px solid var(--input-bd); border-radius: 11px; padding: 11px 14px;
  font-size: 15px; letter-spacing: -0.224px; font-family: inherit; outline: none; background: var(--input-bg); color: var(--ink);
}
#panel input[type="text"]:focus, #panel textarea:focus { border-color: var(--accent-focus); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18); }
#panel textarea { resize: none; height: 84px; line-height: 1.47; }
.panel-control { display: block; width: 100%; }
.panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.panel-actions .p-btn { width: 100%; }
.field-label { display: block; margin: 10px 2px 5px; color: var(--dim); font-size: 12px; font-weight: 600; }
.p-btn {
  border: none; border-radius: 11px; padding: 11px 18px; font-size: 15px; font-weight: 500;
  letter-spacing: -0.224px; font-family: inherit; cursor: pointer; background: var(--panel-btn); color: var(--ink);
  transition: background 200ms cubic-bezier(0.32, 0.72, 0, 1);
}
.p-btn:hover { background: var(--panel-btn-h); }
.p-btn.dark { background: var(--accent); color: #fff; font-weight: 600; }
.p-btn.dark:hover { background: var(--accent-focus); }
.p-btn.tertiary {
  display: block; width: auto; padding: 8px 2px; margin-top: 4px;
  background: transparent; color: var(--accent); font-size: 13px; font-weight: 600;
}
.p-btn.tertiary:hover { background: transparent; color: var(--accent-focus); }
.p-btn.danger { color: #ff3b30; }
.p-btn.wide { display: block; width: 100%; text-align: left; margin-top: 8px; }
.p-btn.wide:first-of-type { margin-top: 0; }
/* 操作单里的底色圆点（仅文字卡）：默认墨块 + iOS 系统色 */
.color-dots { display: flex; gap: 8px; margin-bottom: 12px; }
.color-dots .dot {
  width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
  transition: transform 200ms cubic-bezier(0.32, 0.72, 0, 1);
}
.color-dots .dot:hover { transform: scale(1.12); }
.color-dots .dot.auto { background: var(--chip-bg); }
.color-dots .dot.now { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 操作单里的定档色块：色即是档 */
.tier-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tier-chips .chip {
  flex: 1 1 30%; min-width: 62px; border: none; border-radius: 11px; padding: 11px 4px;
  font-size: 13px; font-weight: 700; font-family: inherit; color: #111213; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14);
  transition: transform 200ms cubic-bezier(0.32, 0.72, 0, 1);
}
.tier-chips .chip:hover { transform: scale(1.04); }
.tier-chips .chip.now { box-shadow: inset 0 0 0 2px var(--accent); }
.tier-chips .pool-chip { background: var(--panel-btn); color: var(--ink); }
.ratio-grid { display: flex; gap: 8px; }
.ratio-grid .p-btn { flex: 1; text-align: center; padding: 14px 0; }
.ratio-grid small { display: block; font-weight: 500; color: var(--dim); margin-top: 3px; font-size: 11px; }
.hidden-input { display: none; }

body.file-over::after {
  content: "松手批量加入图片"; position: fixed; inset: 16px; z-index: 500;
  display: grid; place-items: center; border: 3px dashed var(--accent); border-radius: 24px;
  background: rgba(0, 102, 204, 0.14); color: var(--accent); font-size: 22px; font-weight: 700;
  pointer-events: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}

.hint {
  display: grid; gap: 4px; width: min(100%, 520px); margin: 24px auto 0;
  color: var(--dim); font-size: 13px; letter-spacing: -0.08px; line-height: 1.65; text-align: center;
}
.hint p { margin: 0; }

/* ============================================================
   部署站点外壳：不进入 Skill 模板与离线产物
   ============================================================ */
#site-meta {
  display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  padding: 14px 16px 0; font-size: 13px; line-height: 1;
}
.site-meta-link, .site-meta-copy {
  min-height: 36px; display: inline-flex; align-items: center; gap: 8px;
  border-radius: 9999px; padding: 0 13px;
  background: var(--glass); color: var(--ink);
  box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 4px 14px rgba(0, 0, 0, 0.07);
  backdrop-filter: blur(18px) saturate(1.8); -webkit-backdrop-filter: blur(18px) saturate(1.8);
  font: 600 13px/1 system-ui, -apple-system, "PingFang SC", sans-serif;
  text-decoration: none; white-space: nowrap;
  transition: background 160ms ease, color 160ms ease, transform 100ms ease;
}
.site-meta-link:hover, .site-meta-copy:hover { background: var(--panel-btn-h); }
.site-meta-link svg, .site-meta-copy svg { width: 16px; height: 16px; flex: 0 0 auto; }
.site-meta-github { width: 36px; justify-content: center; padding: 0; }
.site-meta-copy { border: 0; cursor: pointer; }
.site-meta-copy:active { transform: scale(0.97); }
.site-meta-copy.is-copied { color: #248a3d; }
.site-meta-copy.is-error { color: #ff3b30; }

/* ============================================================
   AI 召唤组件：✨ 圆钮 + dock 原位输入条（palette 式）
   视觉语言完全继承 dock：玻璃、胶囊、Apple 缓动
   ============================================================ */
#ai-fab {
  position: fixed; z-index: 200; width: 44px; height: 44px;
  border: none; border-radius: 50%; cursor: pointer; font-size: 18px;
  background: var(--glass); color: var(--ink);
  backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04),
              0 12px 32px rgba(0, 0, 0, 0.12);
  transition: transform 200ms cubic-bezier(0.32, 0.72, 0, 1);
}
#ai-fab:hover { transform: scale(1.08); }
#ai-fab:active { transform: scale(0.96); }
#ai-fab-badge {
  position: absolute; top: 2px; right: 2px; width: 10px; height: 10px;
  border-radius: 50%; background: #ff453a;
  box-shadow: 0 0 0 2px var(--page);
}
body.ai-bar-open #dock { opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(-50%) scale(0.96); }
#ai-bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + var(--safe-b, 0px)); z-index: 210;
  width: min(560px, calc(100vw - 28px));
  display: flex; align-items: center; gap: 8px;
  padding: 6px 6px 6px 16px; border-radius: 9999px;
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(1.8); -webkit-backdrop-filter: blur(20px) saturate(1.8);
  box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04),
              0 12px 32px rgba(0, 0, 0, 0.12);
  animation: ai-bar-in 240ms cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes ai-bar-in { from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(0.98); } }
.ai-bar-spark { font-size: 16px; flex: 0 0 auto; }
#ai-bar-chips { display: flex; gap: 6px; flex: 0 0 auto; }
#ai-bar-chips:empty { display: none; }
.ai-bar-chip {
  border: none; border-radius: 9999px; padding: 8px 12px; cursor: pointer;
  background: var(--panel-btn); color: var(--accent);
  font: 600 13px/1 inherit; font-family: inherit; white-space: nowrap;
  transition: background 160ms ease;
}
.ai-bar-chip:hover { background: var(--panel-btn-h); }
#ai-bar-input {
  flex: 1; min-width: 0; border: none; outline: none; background: transparent;
  color: var(--ink); font-size: 15px; font-family: inherit; letter-spacing: -0.224px;
}
#ai-bar-input::placeholder { color: var(--dim); }
#ai-bar-go {
  flex: 0 0 auto; width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: background 160ms ease;
}
#ai-bar-go:hover { background: var(--accent-focus); }
#ai-bar-go:disabled { opacity: 0.4; cursor: default; }
#ai-bar-close {
  flex: 0 0 auto; width: 36px; height: 36px; border: none; border-radius: 50%;
  background: transparent; color: var(--dim); font-size: 18px; cursor: pointer;
}
#ai-bar-close:hover { color: var(--ink); }
@media (max-width: 640px) {
  /* 窄屏 dock 几乎满宽：圆钮改悬浮于 dock 右上方，拇指可达 */
  #ai-fab { left: auto !important; top: auto !important; right: 14px; bottom: calc(78px + var(--safe-b, 0px)); }
}

</style>
</head>

<!-- hangtola 技能在此注入榜单数据（JSON），保持独立运行时为空对象 -->
<script id="hangtola-data" type="application/json">{}</script>

<script>
/* ============================================================
   常量与状态
   ============================================================ */
const TIER_DEFS = [
  { key: 'hang',  label: '夯',     color: '#fb2018' },
  { key: 'top',   label: '顶级',   color: '#ffa640' },
  { key: 'upper', label: '人上人', color: '#fbf600' },
  { key: 'npc',   label: 'NPC',    color: '#fdf1c7' },
  { key: 'la',    label: '拉完了', color: '#ffffff' }
];
const RATIOS = { '3:4': [1200, 1600], '4:3': [1600, 1200], '16:9': [1920, 1080] };
/* 导出配色随当前模式（底为透明，只管网格与文字）：浅色 = 参考图原味，深色 = 经典暗版 */
const THEMES = {
  light: { row: '#d2d4d8', line: '#111213', ink: '#111213', chipBg: '#1d1d1f', chipInk: '#ffffff', dim: '#6e7480', capBg: '#ffffff', ring: 'rgba(17,18,19,0.28)' },
  dark:  { row: '#3a3a3e', line: '#0b0b0c', ink: '#f5f5f7', chipBg: '#f5f5f7', chipInk: '#111213', dim: '#98989f', capBg: '#1c1c1e', ring: 'rgba(0,0,0,0.5)' }
};
/* 文字卡可选底色：iOS 系统色，与 Apple 外壳同源；null = 默认墨块（随主题反色） */
const CHIP_COLORS = ['#ffffff', '#ff453a', '#ff9f0a', '#ffd60a', '#30d158', '#0a84ff', '#bf5af2'];
const items = new Map();          // id -> { text, image, note, color }
let boardId = 'default';
let nextId = 1;
/* 底部声明：默认为空（删比加烦），想要的人在 ⋯ 菜单一键填入；字面量不依赖 DOM */
const DEFAULT_FOOTNOTE = '以上内容纯属个人主观体验，不代表任何客观评价，仅供参考';

const $ = (sel) => document.querySelector(sel);
const board = $('#board');

/* ============================================================
   构建榜单骨架（档位名可编辑）
   ============================================================ */
for (const t of TIER_DEFS) {
  const row = document.createElement('div');
  row.className = 'tier';
  row.innerHTML = `<div class="tier-label" contenteditable="true" spellcheck="false"
                        style="background:${t.color}" data-key="${t.key}">${t.label}</div>
                   <div class="tier-items" data-tier="${t.key}"></div>`;
  board.appendChild(row);
}

/* ============================================================
   大图榜单持久化：IndexedDB 承担主存储，localStorage 只做旧数据回退
   ============================================================ */
const DB_NAME = 'hangtola';
const DB_STORE = 'boards';

function openBoardDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB 不可用')); return; }
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains(DB_STORE)) {
        request.result.createObjectStore(DB_STORE, { keyPath: 'id' });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function loadSavedBoard(id) {
  try {
    const db = await openBoardDB();
    const saved = await new Promise((resolve, reject) => {
      const request = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(id);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    });
    db.close();
    if (saved) return saved;
  } catch (error) {
    console.warn('IndexedDB 读取失败，回退旧存储', error);
  }
  try { return JSON.parse(localStorage.getItem('hangtola:' + id) || 'null'); }
  catch (error) { return null; }
}

async function persistBoard(data) {
  try {
    const db = await openBoardDB();
    await new Promise((resolve, reject) => {
      const request = db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(data);
      request.onsuccess = resolve;
      request.onerror = () => reject(request.error);
    });
    db.close();
  } catch (error) {
    try { localStorage.setItem('hangtola:' + data.id, JSON.stringify(data)); }
    catch (fallbackError) { console.warn('自动保存失败，请导出 JSON 保留数据', fallbackError); }
  }
}

async function removeSavedBoard(id) {
  try {
    const db = await openBoardDB();
    await new Promise((resolve, reject) => {
      const request = db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).delete(id);
      request.onsuccess = resolve;
      request.onerror = () => reject(request.error);
    });
    db.close();
  } catch (error) {}
  localStorage.removeItem('hangtola:' + id);
}

/* ============================================================
   数据载入：内嵌 JSON vs 本地自动保存，savedAt 新者胜
   ============================================================ */
async function loadInitialData() {
  let embedded = {};
  try { embedded = JSON.parse($('#hangtola-data').textContent || '{}'); } catch (e) {}
  boardId = embedded.id || 'default';
  const saved = await loadSavedBoard(boardId);
  const eTime = Date.parse(embedded.savedAt || 0) || 0;
  const sTime = saved ? (Date.parse(saved.savedAt || 0) || 1) : -1;
  applyData((sTime >= eTime && saved) ? saved : embedded);
}

function applyData(data) {
  if (!data || typeof data !== 'object') return;
  items.clear();
  window.__hangtolaDims = Array.isArray(data.dimensions) ? data.dimensions : [];
  document.querySelectorAll('.tier-items').forEach(el => el.innerHTML = '');
  if (typeof data.title === 'string') $('#board-title').textContent = data.title;
  /* 字段缺失 = 用默认声明；显式空串 = 用户主动清掉，尊重之 */
  $('#board-footnote').textContent =
    typeof data.footnote === 'string' ? data.footnote.trim() : '';
  const buckets = {};
  (data.tiers || []).forEach(t => {
    buckets[t.key] = t.items || [];
    const labelEl = document.querySelector(`.tier-label[data-key="${t.key}"]`);
    if (labelEl && t.label) labelEl.textContent = t.label;
  });
  buckets.pool = data.pool || [];
  for (const [tierKey, list] of Object.entries(buckets)) {
    const container = document.querySelector(`.tier-items[data-tier="${tierKey}"]`);
    if (!container) continue;
    for (const it of list) {
      const id = 'i' + (nextId++);
      items.set(id, {
        text: it.text || '', image: it.image || null,
        note: it.note || '', color: it.image ? null : (it.color || null)
      });
      container.appendChild(buildCard(id));
    }
  }
}

/* ============================================================
   序列化与自动保存
   ============================================================ */
function serialize() {
  const readContainer = (key) =>
    [...document.querySelectorAll(`.tier-items[data-tier="${key}"] .card-item`)]
      .map(el => {
        const it = items.get(el.dataset.id);
        return { text: it.text, image: it.image, note: it.note, color: it.color };
      });
  return {
    id: boardId,
    title: $('#board-title').textContent.trim(),
    footnote: $('#board-footnote').textContent.trim(),
    savedAt: new Date().toISOString(),
    dimensions: window.__hangtolaDims || [],
    tiers: TIER_DEFS.map(t => ({
      key: t.key,
      label: document.querySelector(`.tier-label[data-key="${t.key}"]`).textContent.trim() || t.label,
      color: t.color,
      items: readContainer(t.key)
    })),
    pool: readContainer('pool')
  };
}

let saveTimer = null;
function autosave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => persistBoard(serialize()), 400);
}
$('#board-title').addEventListener('input', autosave);
$('#board-footnote').addEventListener('input', autosave);
/* contenteditable 清空后常残留 <br>，:empty 便失效——失焦时抹平，让空的真正消失 */
for (const sel of ['#board-title', '#board-footnote']) {
  $(sel).addEventListener('blur', (e) => {
    if (!e.target.textContent.trim()) { e.target.textContent = ''; autosave(); }
  });
}
document.body.addEventListener('input', (e) => { if (e.target.classList.contains('tier-label')) autosave(); });

/* ============================================================
   卡片：创建 / 刷新 / 新增
   ============================================================ */
/* 相对亮度：决定彩色底上用黑字还是白字 */
function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
}
/* 字号随字数自适应：字少则大，字多则小 */
function fsClass(t) { const n = t.length; return n <= 2 ? 'fs-xl' : n <= 4 ? 'fs-l' : n <= 8 ? 'fs-m' : 'fs-s'; }

function buildCard(id) {
  const it = items.get(id);
  const el = document.createElement('div');
  el.dataset.id = id;
  el.title = it.text;
  if (it.image) {
    el.className = 'card-item is-img';
    el.innerHTML = `<div class="thumb"><img src="${it.image}" alt=""></div>` +
                   (it.text ? `<div class="name"></div>` : '');
    if (it.text) el.querySelector('.name').textContent = it.text;
  } else {
    el.className = 'card-item is-txt';
    el.innerHTML = `<div class="txt ${fsClass(it.text)}"></div>`;
    const tx = el.querySelector('.txt');
    tx.textContent = it.text;
    if (it.color) {
      el.style.background = it.color;
      tx.style.color = lum(it.color) > 0.62 ? '#111213' : '#fff';
    }
  }
  return el;
}

/* 文件名"像人话"才带入（含中文或短英文词），流水号一律不要 */
function guessName(filename) {
  const base = filename.replace(/\.[^.]+$/, '').trim();
  if (!base || base.length > 14) return '';
  if (/^(IMG|DSC|DCIM|Screenshot|Snipaste|WeChat|Pasted|image|photo|截屏|截图|微信图片)/i.test(base)) return '';
  const meat = base.replace(/[\d_\-\s.()]/g, '');
  if (meat.length < 2) return '';
  return base;
}
function refreshCard(el) { const n = buildCard(el.dataset.id); el.replaceWith(n); return n; }
function addItem(text, image) {
  const id = 'i' + (nextId++);
  items.set(id, { text: text || '', image: image || null, note: '', color: null });
  document.querySelector('.tier-items[data-tier="pool"]').appendChild(buildCard(id));
  autosave();
}

/* ============================================================
   指针拖拽（鼠标 + 触屏统一）：移动即拖，原地轻点开操作单
   ============================================================ */
let drag = null;   // { id, el, ghost, started, sx, sy, hold }
document.body.addEventListener('pointerdown', (e) => {
  const card = e.target.closest('.card-item');
  if (!card || e.button > 0) return;
  drag = { id: card.dataset.id, el: card, ghost: null, started: false, sx: e.clientX, sy: e.clientY };
  /* 长按（450ms 未拖动）＝ 轻点的同义词：打开同一张操作单 */
  drag.hold = setTimeout(() => {
    if (!drag || drag.started) return;
    const el = drag.el; drag = null;
    if (navigator.vibrate) navigator.vibrate(10);
    openCardSheet(el);
  }, 450);
});
document.body.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 7) return;
    clearTimeout(drag.hold);
    drag.started = true;
    const g = drag.el.cloneNode(true);
    g.id = 'drag-ghost';
    const r = drag.el.getBoundingClientRect();
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.el.classList.add('drag-source');
    if (navigator.vibrate) navigator.vibrate(8);
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  const zone = document.elementFromPoint(e.clientX, e.clientY)?.closest('.tier-items');
  if (zone) zone.classList.add('drag-over');
});
function endDrag(e, cancelled) {
  if (!drag) return;
  const d = drag; drag = null;
  clearTimeout(d.hold);
  if (!d.started) { if (!cancelled) openCardSheet(d.el); return; }
  d.ghost?.remove();
  d.el.classList.remove('drag-source');
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  if (cancelled) return;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const zone = under?.closest('.tier-items');
  if (!zone) return;
  const targetCard = under?.closest('.card-item');
  if (targetCard && targetCard !== d.el) zone.insertBefore(d.el, targetCard);
  else zone.appendChild(d.el);
  autosave();
}
document.body.addEventListener('pointerup', (e) => endDrag(e, false));
document.body.addEventListener('pointercancel', (e) => endDrag(e, true));
/* 右键（桌面端）＝ 轻点的同义词：打开同一张操作单 */
document.body.addEventListener('contextmenu', (e) => {
  const card = e.target.closest('.card-item');
  if (!card) return;
  e.preventDefault();
  drag = null;
  openCardSheet(card);
});

/* ============================================================
   弹层系统：touch bar 的延伸面板
   ============================================================ */
function closePanel() { $('#mask')?.remove(); $('#panel')?.remove(); }
function openPanel(html) {
  closePanel();
  const mask = document.createElement('div'); mask.id = 'mask';
  mask.addEventListener('pointerdown', closePanel);
  const panel = document.createElement('div'); panel.id = 'panel';
  panel.innerHTML = html;
  document.body.append(mask, panel);
  return panel;
}

/* ---- ＋ 文字 ---- */
function openTextPanel() {
  const p = openPanel(`
    <h3 class="panel-title">添加文字</h3>
    <input class="panel-control" type="text" id="p-text" aria-label="名称"
           placeholder="输入名称，多个用逗号隔开" autocomplete="off">
    <div class="panel-actions">
      <button class="p-btn" id="p-text-cancel">取消</button>
      <button class="p-btn dark" id="p-text-ok">添加</button>
    </div>`);
  const input = p.querySelector('#p-text');
  input.focus();
  const commit = () => {
    const raw = input.value.trim();
    if (!raw) return;
    raw.split(/[,，、\n]+/).map(s => s.trim()).filter(Boolean).forEach(t => addItem(t, null));
    closePanel();
  };
  p.querySelector('#p-text-cancel').addEventListener('click', closePanel);
  p.querySelector('#p-text-ok').addEventListener('click', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(); });
}

/* ---- 导出图片：选比例即出图 ---- */
function openExportPanel() {
  const p = openPanel(`
    <h3 class="panel-title">导出图片</h3>
    <div class="ratio-grid">
      <button class="p-btn" data-ratio="3:4">3:4<small>竖图</small></button>
      <button class="p-btn" data-ratio="4:3">4:3<small>横图</small></button>
      <button class="p-btn" data-ratio="16:9">16:9<small>宽屏</small></button>
    </div>`);
  p.querySelectorAll('[data-ratio]').forEach(btn =>
    btn.addEventListener('click', () => { closePanel(); exportPNG(btn.dataset.ratio); }));
}

/* ---- 底部声明：默认文案只填入，用户确认后再保存 ---- */
function openFootnotePanel() {
  const p = openPanel(`
    <h3 class="panel-title">底部声明</h3>
    <p class="panel-subtitle">不填则不显示</p>
    <textarea class="panel-control" id="p-ft" aria-label="底部声明"
              placeholder="输入声明" autocomplete="off"></textarea>
    <button class="p-btn tertiary" id="p-ft-def">使用默认文案</button>
    <div class="panel-actions">
      <button class="p-btn" id="p-ft-cancel">取消</button>
      <button class="p-btn dark" id="p-ft-ok">保存</button>
    </div>`);
  const input = p.querySelector('#p-ft');
  input.value = $('#board-footnote').textContent.trim();
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  const save = () => {
    $('#board-footnote').textContent = input.value.replace(/\s+/g, ' ').trim();
    autosave();
    closePanel();
  };
  p.querySelector('#p-ft-def').addEventListener('click', () => {
    input.value = DEFAULT_FOOTNOTE;
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  });
  p.querySelector('#p-ft-cancel').addEventListener('click', closePanel);
  p.querySelector('#p-ft-ok').addEventListener('click', save);
}

/* ---- ⋯ 更多 ---- */
function openMorePanel() {
  const p = openPanel(`
    <h3 class="panel-title">更多</h3>
    <button class="p-btn wide" data-m="save">导出榜单数据</button>
    <button class="p-btn wide" data-m="load">导入榜单数据</button>
    <button class="p-btn wide" data-m="foot">底部声明</button>
    <button class="p-btn wide danger" data-m="reset">重置为初始数据</button>`);
  p.addEventListener('click', async (e) => {
    const m = e.target.dataset.m;
    if (!m) return;
    if (m === 'foot') { openFootnotePanel(); return; }
    closePanel();
    if (m === 'save') {
      const data = serialize();
      download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }),
               (data.title || 'hangtola') + '.json');
    }
    if (m === 'load') $('#json-input').click();
    if (m === 'reset' && confirm('清除本地编辑，恢复为文件内嵌的初始数据？')) {
      await removeSavedBoard(boardId);
      /* 重放内嵌数据而非刷新页面：保留主题等状态，体验不断片。
         applyData 对缺失字段是"保持不动"，故先归位标题与档位名默认值 */
      $('#board-title').textContent = '';
      TIER_DEFS.forEach(t => {
        document.querySelector(`.tier-label[data-key="${t.key}"]`).textContent = t.label;
      });
      let embedded = {};
      try { embedded = JSON.parse($('#hangtola-data').textContent || '{}'); } catch (err) {}
      applyData(embedded);
    }
  });
}

/* ---- 卡片操作单：定档 / 改名 / 删除（轻点、长按、右键同源） ---- */
function openCardSheet(cardEl) {
  const id = cardEl.dataset.id;
  const it = items.get(id);
  if (!it) return;
  const currentTier = cardEl.closest('.tier-items')?.dataset.tier;
  const chips = TIER_DEFS.map(t => {
    const label = document.querySelector(`.tier-label[data-key="${t.key}"]`).textContent.trim() || t.label;
    return `<button class="chip${t.key === currentTier ? ' now' : ''}" style="background:${t.color}" data-t="${t.key}">${escapeHtml(label)}</button>`;
  }).join('') + `<button class="chip pool-chip${currentTier === 'pool' ? ' now' : ''}" data-t="pool">备选</button>`;
  const dots = it.image ? '' : `<div class="color-dots">
    <button class="dot auto${!it.color ? ' now' : ''}" data-col="" title="默认"></button>
    ${CHIP_COLORS.map(c => `<button class="dot${it.color === c ? ' now' : ''}" style="background:${c}" data-col="${c}"></button>`).join('')}
  </div>`;
  const p = openPanel(`
    <h3>${it.text ? escapeHtml(it.text) : '未命名条目'}</h3>
    <div class="tier-chips">${chips}</div>
    ${dots}
    <button class="p-btn wide" data-c="rename">改名</button>
    <button class="p-btn wide danger" data-c="del">删除</button>`);
  p.addEventListener('click', (e) => {
    if (e.target.dataset.col !== undefined) {
      it.color = e.target.dataset.col || null;
      autosave();
      openCardSheet(refreshCard(cardEl));
      return;
    }
    const t = e.target.dataset.t;
    if (t && t !== currentTier) {
      document.querySelector(`.tier-items[data-tier="${t}"]`).appendChild(cardEl);
      autosave(); closePanel();
      return;
    }
    const c = e.target.dataset.c;
    if (!c) return;
    if (c === 'del') { items.delete(id); cardEl.remove(); autosave(); closePanel(); }
    if (c === 'rename') {
      const q = openPanel(`
        <h3 class="panel-title">修改名称</h3>
        <input class="panel-control" type="text" id="p-rn" aria-label="名称"
               placeholder="输入名称" autocomplete="off">
        <div class="panel-actions">
          <button class="p-btn" id="p-rn-cancel">取消</button>
          <button class="p-btn dark" id="p-rn-ok">保存</button>
        </div>`);
      const inp = q.querySelector('#p-rn'); inp.value = it.text; inp.focus(); inp.select();
      const ok = () => { it.text = inp.value.trim(); refreshCard(cardEl); autosave(); closePanel(); };
      q.querySelector('#p-rn-cancel').addEventListener('click', closePanel);
      q.querySelector('#p-rn-ok').addEventListener('click', ok);
      inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') ok(); });
    }
  });
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ---- 深浅色模式 ---- */
let theme = localStorage.getItem('hangtola-theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme(t) {
  theme = t;
  document.documentElement.dataset.theme = t;
  localStorage.setItem('hangtola-theme', t);
  $('#theme-btn').textContent = t === 'dark' ? '☀' : '☾';
}

/* ---- dock 分发 ---- */
$('#dock').addEventListener('click', (e) => {
  const act = e.target.closest('button')?.dataset.act;
  if (act === 'text') openTextPanel();
  if (act === 'image') $('#file-input').click();
  if (act === 'export') openExportPanel();
  if (act === 'theme') applyTheme(theme === 'dark' ? 'light' : 'dark');
  if (act === 'more') openMorePanel();
});

/* ============================================================
   图片入口：多选 / 拖入 / 粘贴；Promise.all 保证异步压缩后仍按输入顺序加入
   ============================================================ */
function readImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('文件读取失败'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error(`无法解析图片：${file.name || '粘贴图片'}`));
      img.onload = () => {
        /* 保留原始比例，只压尺寸（长边 ≤512）；裁切交给显示层，数据不失真 */
        const MAX = 512, cv = document.createElement('canvas');
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        cv.width = Math.max(1, Math.round(img.width * scale));
        cv.height = Math.max(1, Math.round(img.height * scale));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addImageFiles(fileList) {
  const files = [...fileList].filter(file => file?.type?.startsWith('image/'));
  if (!files.length) return;
  try {
    const prepared = await Promise.all(files.map(async file => ({
      text: guessName(file.name || ''),
      image: await readImageFile(file)
    })));
    prepared.forEach(item => addItem(item.text, item.image));
  } catch (error) {
    alert(error.message);
  }
}

$('#file-input').addEventListener('change', async (e) => {
  await addImageFiles(e.target.files);
  e.target.value = '';
});
document.addEventListener('paste', async (e) => {
  const files = [...e.clipboardData.items]
    .filter(item => item.type.startsWith('image/'))
    .map(item => item.getAsFile())
    .filter(Boolean);
  if (!files.length) return;
  e.preventDefault();
  await addImageFiles(files);
});
document.addEventListener('dragover', (e) => {
  if (![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  document.body.classList.add('file-over');
});
document.addEventListener('dragleave', (e) => {
  if (!e.relatedTarget) document.body.classList.remove('file-over');
});
document.addEventListener('drop', async (e) => {
  document.body.classList.remove('file-over');
  const files = [...e.dataTransfer.files].filter(file => file.type.startsWith('image/'));
  if (!files.length) return;
  e.preventDefault();
  await addImageFiles(files);
});

/* ============================================================
   JSON 导入
   ============================================================ */
function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
$('#json-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  file.text().then(txt => {
    try { applyData(JSON.parse(txt)); autosave(); }
    catch (err) { alert('JSON 解析失败：' + err.message); }
  });
  e.target.value = '';
});

/* ============================================================
   PNG 导出：干净所见即所得——淡蓝底 + 黑框网格，无水印
   ============================================================ */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapText(ctx, text, maxWidth, maxLines) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxWidth && line) {
      lines.push(line); line = ch;
      if (lines.length === maxLines) break;
    } else line += ch;
  }
  if (lines.length < maxLines && line) lines.push(line);
  else if (line && lines.length === maxLines) lines[maxLines - 1] = lines[maxLines - 1].slice(0, -1) + '…';
  return lines;
}

function clampNumber(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function fitTierLabel(ctx, text, maxWidth, rowHeight, frameScale, fontFamily) {
  let fontSize = clampNumber(rowHeight * 0.18, 32 * frameScale, 52 * frameScale);
  const minFontSize = 20 * frameScale;
  while (fontSize > minFontSize) {
    ctx.font = `800 ${fontSize}px ${fontFamily}`;
    const lines = wrapText(ctx, text, maxWidth, 2);
    const lineHeight = fontSize * 1.18;
    const widestLine = Math.max(0, ...lines.map(line => ctx.measureText(line).width));
    if (widestLine <= maxWidth && lines.length * lineHeight <= rowHeight - 24 * frameScale) {
      return { fontSize, lines, lineHeight };
    }
    fontSize -= 0.5;
  }
  ctx.font = `800 ${minFontSize}px ${fontFamily}`;
  return {
    fontSize: minFontSize,
    lines: wrapText(ctx, text, maxWidth, 2),
    lineHeight: minFontSize * 1.18,
  };
}

async function exportPNG(ratio) {
  const data = serialize();
  const T = THEMES[theme];
  const [W, H] = RATIOS[ratio];
  const u = W / 1600;                                   // 尺寸归一化单位
  const frameScale = Math.min(W, H) / 1200;             // 画框与说明文字按短边保持光学密度
  const FONT = '"PingFang SC","Microsoft YaHei",sans-serif';

  /* 预载图片 */
  const imgCache = new Map();
  await Promise.all(data.tiers.flatMap(t => t.items).filter(it => it.image).map(it => new Promise(res => {
    const im = new Image();
    im.onload = () => { imgCache.set(it.image, im); res(); };
    im.onerror = res;
    im.src = it.image;
  })));

  /* 布局：统一槽位（方图 S + 名字行 capH），上下铺满、留白不算比例。
     卡片参与铺满：槽位随缩放系数 k 变大/变小，二分求「卡片自然撑起的网格高度」
     恰好逼近画幅可用高度的 k——卡片先长到刚好铺满，残差再均摊进行高；
     k 有上下限（防空榜卡片巨大化 / 爆量时过碎），内容仍超高才退回整体缩小。 */
  const pad = 56 * frameScale, bw = 4 * frameScale;     // 外边距 / 边框宽
  const hasTitle = !!data.title;
  const titleH = hasTitle ? 96 * frameScale : 0;
  const footH = data.footnote ? 52 * frameScale : 0;    // 声明条：贴着网格底边的实心黑条
  const gridW = W - pad * 2;
  const labelMeasure = document.createElement('canvas').getContext('2d');
  labelMeasure.font = `800 ${52 * frameScale}px ${FONT}`;
  const measuredLabelW = Math.max(...data.tiers.map(t => labelMeasure.measureText(t.label).width)) + 48 * frameScale;
  const labelW = Math.round(clampNumber(measuredLabelW, gridW * 0.15, gridW * 0.22));
  const availH = H - pad * 2 - titleH - footH;
  const layout = (kk) => {
    const gap = 10 * u * kk, S = 150 * u * kk, capH = 32 * u * kk, slotH = S + capH;
    const minRowH = slotH + gap * 2;
    const perRow = Math.max(1, Math.floor((gridW - labelW - gap * 2) / (S + gap)));
    const rowHeights = data.tiers.map(t => {
      const rows = Math.max(1, Math.ceil(t.items.length / perRow));
      return Math.max(minRowH, rows * (slotH + gap) + gap);
    });
    return { gap, S, capH, slotH, perRow, rowHeights, gridH: rowHeights.reduce((a, b) => a + b, 0) };
  };
  let lo = 0.55, hi = 2.2, k = 1;
  for (let i = 0; i < 24; i++) {
    k = (lo + hi) / 2;
    if (layout(k).gridH > availH) hi = k; else lo = k;
  }
  k = lo;
  const { gap, S, capH, slotH, perRow, rowHeights } = layout(k);
  let gridH = rowHeights.reduce((a, b) => a + b, 0);
  if (gridH < availH) {   // 二分残差与 k 触顶的富余：均摊进行高
    const extra = (availH - gridH) / rowHeights.length;
    for (let i = 0; i < rowHeights.length; i++) rowHeights[i] += extra;
    gridH = availH;
  }
  const totalH = pad + titleH + gridH + footH + pad;
  const scale = Math.min(1, H / totalH);

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  /* 背景不填充：PNG 透明底，贴到任何地方都干净 */
  ctx.save();
  ctx.translate((W - W * scale) / 2, (H - totalH * scale) / 2);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  /* 标题（留空则纯网格） */
  if (hasTitle) {
    ctx.fillStyle = T.ink;
    ctx.font = `800 ${52 * frameScale}px ${FONT}`;
    ctx.fillText(data.title, W / 2, pad + titleH / 2 - 12 * frameScale);
  }

  /* 网格主体 */
  const gx = pad, gy = pad + titleH;
  ctx.fillStyle = T.row;
  ctx.fillRect(gx, gy, gridW, gridH);

  let y = gy;
  data.tiers.forEach((t, i) => {
    const rh = rowHeights[i];
    /* 档位色块 + 名称（黑字，色块本身够亮，两种模式通用） */
    ctx.fillStyle = t.color;
    ctx.fillRect(gx, y, labelW, rh);
    ctx.fillStyle = '#111213';
    const labelLayout = fitTierLabel(ctx, t.label, labelW - 24 * frameScale, rh, frameScale, FONT);
    const ly0 = y + rh / 2 - (labelLayout.lines.length - 1) * labelLayout.lineHeight / 2;
    labelLayout.lines.forEach((line, lineIndex) => {
      ctx.fillText(line, gx + labelW / 2, ly0 + lineIndex * labelLayout.lineHeight);
    });

    /* 条目：统一竖版框。无名图＝铺满整框；有名图＝上图下名字条；文字＝色块撑满整框 */
    t.items.forEach((it, j) => {
      const col = j % perRow, row = Math.floor(j / perRow);
      const x = gx + labelW + gap + col * (S + gap);
      const iy = y + gap + row * (slotH + gap);
      ctx.save();
      roundRect(ctx, x, iy, S, slotH, 4 * u * k); ctx.clip();
      if (it.image && imgCache.has(it.image)) {
        const im = imgCache.get(it.image);
        const areaH = it.text ? S : slotH;
        const sc = Math.max(S / im.width, areaH / im.height);
        ctx.drawImage(im, x + (S - im.width * sc) / 2, iy + (areaH - im.height * sc) / 2, im.width * sc, im.height * sc);
        if (it.text) {
          ctx.fillStyle = T.capBg;
          ctx.fillRect(x, iy + S, S, capH);
          ctx.fillStyle = T.ink;
          ctx.font = `600 ${19 * u * k}px ${FONT}`;
          ctx.fillText(wrapText(ctx, it.text, S - 10 * u * k, 1)[0] || '', x + S / 2, iy + S + capH / 2 + 1 * u);
        }
      } else {
        const bg = it.color || T.chipBg;
        ctx.fillStyle = bg;
        ctx.fillRect(x, iy, S, slotH);
        ctx.fillStyle = it.color ? (lum(it.color) > 0.62 ? '#111213' : '#ffffff') : T.chipInk;
        const n = (it.text || '').length;
        const cfs = (n <= 2 ? 36 : n <= 4 ? 29 : n <= 8 ? 23 : 19) * u * k;
        ctx.font = `800 ${cfs}px ${FONT}`;
        const lines = wrapText(ctx, it.text, S - 16 * u * k, 4);
        const tlh = cfs * 1.25, ty0 = iy + slotH / 2 - (lines.length - 1) * tlh / 2;
        lines.forEach((ln, k) => ctx.fillText(ln, x + S / 2, ty0 + k * tlh));
      }
      ctx.restore();
      /* 统一细边框，贴近编辑器观感 */
      ctx.strokeStyle = T.ring;
      ctx.lineWidth = 1.2 * u;
      roundRect(ctx, x, iy, S, slotH, 4 * u * k); ctx.stroke();
    });
    y += rh;
  });

  /* 网格线：外框 + 行分隔 + 标签列分隔 */
  ctx.strokeStyle = T.line;
  ctx.lineWidth = bw;
  ctx.strokeRect(gx, gy, gridW, gridH);
  ctx.beginPath();
  let ly = gy;
  for (let i = 0; i < data.tiers.length - 1; i++) {
    ly += rowHeights[i];
    ctx.moveTo(gx, ly); ctx.lineTo(gx + gridW, ly);
  }
  ctx.moveTo(gx + labelW, gy); ctx.lineTo(gx + labelW, gy + gridH);
  ctx.stroke();

  /* 底部声明条：黑底白字，与外框咬合成表格的最后一行 */
  if (data.footnote) {
    const fy = gy + gridH;
    ctx.fillStyle = T.line;
    ctx.fillRect(gx - bw / 2, fy - bw / 2, gridW + bw, footH + bw / 2);
    let ffs = 22 * frameScale;
    ctx.font = `500 ${ffs}px ${FONT}`;
    const maxW = gridW - 40 * frameScale, tw = ctx.measureText(data.footnote).width;
    if (tw > maxW) ctx.font = `500 ${ffs * maxW / tw}px ${FONT}`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(data.footnote, gx + gridW / 2, fy + footH / 2 + 1 * frameScale);
  }

  ctx.restore();
  cv.toBlob(b => download(b, `${data.title || 'hangtola'}-${ratio.replace(':', 'x')}.png`), 'image/png');
}

/* ============================================================
   软键盘监听：visualViewport 收缩量即键盘高度，写入 --kb，
   面板 bottom 用 max() 自动上浮，输入框不被键盘盖住
   ============================================================ */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const updateKb = () => {
    const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
  };
  vv.addEventListener('resize', updateKb);
  vv.addEventListener('scroll', updateKb);
}

/* ============================================================
   启动
   ============================================================ */
applyTheme(theme);
loadInitialData();
</script>
<script>
/**
 * [INPUT]: 依赖编辑器 dock DOM（定位锚点）与页面注入的 --safe-b/--accent 设计变量
 * [OUTPUT]: 对外提供 window.hangtolaAiBar.init({placeholder, chips, onSubmit})：dock 右侧 ✨ 圆钮 + dock 原位变形 AI 输入条（palette 式：说完即走）
 * [POS]: 单机版（升舱/主题生成）与云端版（改榜/排备选）共用的唯一 AI 召唤组件——零依赖，视觉语言完全继承 dock
 * [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
 */

/* eslint-disable no-undef */
(() => {
  function init({ placeholder, chips, onSubmit, badge }) {
    const dock = document.querySelector('#dock');
    if (!dock) return null;

    /* ---- ✨ 圆钮：贴着 dock 右侧，同一悬浮语言 ---- */
    const fab = document.createElement('button');
    fab.id = 'ai-fab';
    fab.type = 'button';
    fab.setAttribute('aria-label', 'AI');
    fab.innerHTML = '✨<span id="ai-fab-badge" hidden></span>';
    document.body.appendChild(fab);

    const place = () => {
      const rect = dock.getBoundingClientRect();
      fab.style.left = `${rect.right + 10}px`;
      fab.style.top = `${rect.top + (rect.height - 44) / 2}px`;
    };
    requestAnimationFrame(place);
    addEventListener('resize', place);
    /* dock 尺寸随字体/内容变化：观察一次布局稳定 */
    setTimeout(place, 300);

    /* ---- 输入条：dock 原位的第二形态 ---- */
    const bar = document.createElement('div');
    bar.id = 'ai-bar';
    bar.hidden = true;
    bar.innerHTML = [
      '<span class="ai-bar-spark">✨</span>',
      '<div id="ai-bar-chips"></div>',
      '<input type="text" id="ai-bar-input" autocomplete="off">',
      '<button type="button" id="ai-bar-go" aria-label="发送">↑</button>',
      '<button type="button" id="ai-bar-close" aria-label="关闭">×</button>',
    ].join('');
    document.body.appendChild(bar);
    const input = bar.querySelector('#ai-bar-input');
    const go = bar.querySelector('#ai-bar-go');
    input.placeholder = placeholder;

    const renderChips = () => {
      const list = chips ? chips() : [];
      const wrap = bar.querySelector('#ai-bar-chips');
      wrap.innerHTML = '';
      for (const chip of list) {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'ai-bar-chip';
        el.textContent = chip.label;
        el.addEventListener('click', () => chip.onClick(api));
        wrap.appendChild(el);
      }
      const badgeEl = fab.querySelector('#ai-fab-badge');
      const count = badge ? badge() : list.length;
      badgeEl.hidden = !count;
      requestAnimationFrame(place);
    };

    const open = () => {
      /* 清场：任何编辑面板/遮罩让位，AI 条独占底部 */
      if (typeof closePanel === 'function') closePanel();
      renderChips();
      document.body.classList.add('ai-bar-open');
      bar.hidden = false;
      fab.hidden = true;
      input.focus();
    };
    const close = () => {
      document.body.classList.remove('ai-bar-open');
      bar.hidden = true;
      fab.hidden = false;
      input.disabled = false;
      go.disabled = false;
      input.value = '';
      input.placeholder = placeholder;
      renderChips();
      requestAnimationFrame(place);
    };
    /** busy(text)：进入工作态并播报阶段；busy(null)：回到可输入态 */
    const busy = (text) => {
      const working = text !== null && text !== undefined;
      input.disabled = working;
      go.disabled = working;
      if (working) { input.value = ''; input.placeholder = text; }
      else input.placeholder = placeholder;
    };
    /** say(text)：非阻塞提示（婉拒等），保持可输入 */
    const say = (text) => { busy(null); input.placeholder = text; };

    const api = { open, close, busy, say, refresh: renderChips };

    fab.addEventListener('click', open);
    bar.querySelector('#ai-bar-close').addEventListener('click', close);
    input.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    const submit = () => {
      const text = input.value.trim();
      if (!text || input.disabled) return;
      onSubmit(text, api);
    };
    go.addEventListener('click', submit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    /* 快捷键 /：随处唤起（输入场景除外） */
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && !e.metaKey && !e.ctrlKey
          && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName ?? '')
          && document.activeElement?.contentEditable !== 'true'
          && bar.hidden) {
        e.preventDefault();
        open();
      }
    });

    renderChips();
    return api;
  }

  globalThis.hangtolaAiBar = { init };
})();
</script>

<script>
(() => {
  const button = document.querySelector('#copy-skill');
  if (!button) return;
  const label = button.querySelector('[data-copy-label]');
  const installCommand = 'npx skills add hiyeshu/hangtola-skill --skill hangtola';
  button.addEventListener('click', async () => {
    button.classList.remove('is-copied', 'is-error');
    try {
      await navigator.clipboard.writeText(installCommand);
      label.textContent = '已复制';
      button.classList.add('is-copied');
    } catch {
      label.textContent = '复制失败';
      button.classList.add('is-error');
    }
    setTimeout(() => {
      label.textContent = '复制 Skill';
      button.classList.remove('is-copied', 'is-error');
    }, 1800);
  });
})();

/* ============================================================
   AI 智能排（palette 式）：✨ 圆钮唤起输入条 → 升舱或纯主题生成
   仅依赖编辑器全局 serialize 与 hangtolaAiBar 组件
   ============================================================ */
(() => {
  if (!globalThis.hangtolaAiBar) return;
  hangtolaAiBar.init({
    placeholder: '想排什么？给个主题，回车开排',
    chips: () => [],
    onSubmit: (topic, api) => upgrade(topic, api),
  });

  async function upgrade(topic, api) {
    const data = serialize();
    const items = [...data.tiers.flatMap((t) => t.items), ...data.pool];
    try {
      api.busy(items.length
        ? '带着 ' + items.length + ' 个条目升舱…'
        : 'AI 找候选中…');
      const board = await (await fetch('/api/boards', { method: 'POST' })).json();
      localStorage.setItem('hangtola-edit:' + board.boardId, board.editRef);
      const auth = { 'X-Edit-Ref': board.editRef, 'Content-Type': 'application/json' };

      const withImages = items.filter((it) => it.image);
      if (withImages.length) {
        const files = withImages.map((it, i) => ({
          name: (it.text || ('图片' + (i + 1))) + '.png',
          mime: (it.image.match(/^data:([^;]+)/) || [])[1] || 'image/png',
        }));
        const prep = await (await fetch('/api/boards/' + board.boardId + '/assets/prepare', {
          method: 'POST', headers: auth, body: JSON.stringify({ files }),
        })).json();
        for (let i = 0; i < prep.assets.length; i += 1) {
          api.busy('上传图片 ' + (i + 1) + '/' + withImages.length + '…');
          const blob = await (await fetch(withImages[i].image)).blob();
          await fetch(prep.assets[i].uploadUrl, { method: 'PUT', body: blob });
        }
      }

      const extraText = items.map((it) => it.text).filter(Boolean).join('、');
      await fetch('/api/boards/' + board.boardId + '/generate', {
        method: 'POST', headers: auth,
        body: JSON.stringify(Object.assign({ topic: topic }, extraText ? { extraText } : {})),
      });
      for (;;) {
        const snapshot = await (await fetch('/api/boards/' + board.boardId)).json();
        const gen = snapshot.generation;
        if (gen.status === 'done') break;
        if (gen.status === 'failed') throw new Error(gen.detail || '生成失败');
        api.busy((gen.stage || '生成中') + ' ' + gen.pct + '%');
        await new Promise((r) => setTimeout(r, 700));
      }
      api.busy('完成，正在打开云端榜单…');
      location.href = '/b/' + board.boardId + '#k=' + board.editRef;
    } catch (error) {
      api.say('出错了：' + (error && error.message ? error.message : error) + '，回车重试');
    }
  }
})();
</script>
</body>
</html>
