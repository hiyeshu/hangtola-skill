# [INPUT]: 依赖 src/index.ts 入口、HangtolaAgent Durable Object 与（P3 起）R2/Workflow 绑定
# [OUTPUT]: 对外提供 hangtola-agent Worker 运行时配置：DO SQLite 迁移、nodejs 兼容、模型密钥经 wrangler secret 注入
# [POS]: workers/hangtola 的部署真相源；P6 前与根 wrangler.toml（assets-only 生产）并存，届时接管 hangtola.app
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name = "hangtola"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "hangtola.app"
custom_domain = true

[[durable_objects.bindings]]
name = "HANGTOLA_AGENT"
class_name = "HangtolaAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HangtolaAgent"]

[assets]
directory = "./public"
binding = "STATIC"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "hangtola-assets"

[[workflows]]
name = "hangtola-generate"
binding = "GEN_WORKFLOW"
class_name = "GenerateBoardWorkflow"

[vars]
# 生产走真模型（密钥经 wrangler secret 注入：DEEPSEEK_API_KEY / VISION_API_KEY / EXA_API_KEY）；本地 .dev.vars 以 MOCK_MODELS=1 覆盖为确定性桩
MOCK_MODELS = "0"
DEEPSEEK_BASE_URL = "https://api.deepseek.com/v1"
DEEPSEEK_MODEL = "deepseek-chat"
VISION_BASE_URL = "https://ws-gxy1qntoxobkjl4f.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
VISION_MODEL = "qwen3.7-flash"
